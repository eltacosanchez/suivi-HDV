<style>
/* Layout : un seul écran tenu au pouce — scène en haut, journal au milieu, actions en bas. */
:root{
  color-scheme:dark;
  --bg:#17131f; --panel:#241d31; --panel-2:#30273f; --line:#43375a;
  --ink:#f3e9d2; --muted:#a99fb8;
  --gold:#f2b84b; --hp:#e0524a; --mp:#5aa9e6; --ok:#7ac74f; --danger:#ff7a59; --hex:#b48be8;
  --shadow:#0e0b14;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:10px;overflow-y:auto}
h1,h2,.px{font-family:var(--display);letter-spacing:.02em}
h1{font-size:40px;line-height:1;margin:0;color:var(--gold);text-shadow:0 3px 0 var(--shadow);text-wrap:balance}
h2{font-size:22px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
img.spr{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* Boutons */
.btn{background:var(--panel-2);border:2px solid var(--line);border-radius:8px;padding:9px 10px;
  box-shadow:0 3px 0 var(--shadow);text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0;position:relative}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn:disabled{opacity:.42;cursor:default}
.btn b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.15}
.btn small{color:var(--muted);font-size:11.5px;line-height:1.25}
.btn.primary{background:var(--gold);border-color:#ffd98a;color:#2a1c06}
.btn.primary small{color:#5a4212}
.btn.center{text-align:center;align-items:center}
.cost{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:12px;color:var(--mp)}
.link{background:none;border:0;padding:6px 4px;color:var(--muted);font-family:var(--display);font-size:14px}

/* Barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--display);font-size:14px}
.top .where{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .gold{color:var(--gold);white-space:nowrap}
.top .tools{display:flex;flex:none;white-space:nowrap}

/* Scène */
.stage{flex:1 1 auto;min-height:200px;border:2px solid var(--line);border-radius:10px;position:relative;overflow:hidden;
  background:linear-gradient(#22344c 0%,#2c5648 62%,#3b6a3e 62%,#2f5733 100%)}
.stage.z2{background:linear-gradient(#1c1630 0%,#35294e 62%,#4c4662 62%,#3a354c 100%)}
.stage.z3{background:linear-gradient(#2c1626 0%,#7a3b2e 62%,#5c3b35 62%,#432a27 100%)}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff8 1px,transparent 1.5px);
  background-size:67px 53px;background-position:11px 9px;height:45%;opacity:.5}
.foe,.me{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px}
.foe{right:6%;top:8%;width:58%}
.me{left:7%;bottom:7%}
.foe img.spr{width:112px;height:112px}
.foe.boss img.spr{width:148px;height:148px}
.me img.spr{width:96px;height:96px}
.plate{width:100%;background:#0e0b14cc;border:1px solid var(--line);border-radius:6px;padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.plate .nm{display:flex;justify-content:space-between;gap:6px;font-family:var(--display);font-size:14px}
.intent{font-size:12px;border-radius:4px;padding:2px 6px;background:var(--panel-2);align-self:flex-start;font-weight:600}
.intent.danger{background:var(--danger);color:#2a0d05;animation:pulse 0.9s infinite alternate}
.intent.warn{background:var(--gold);color:#2a1c06}
.intent.def{color:var(--mp)}
.intent.debuff{color:var(--hex)}
.bar{height:9px;background:#0e0b14;border-radius:3px;overflow:hidden;border:1px solid #0008}
.bar i{display:block;height:100%;background:var(--hp);transition:width .3s}
.bar.mp i{background:var(--mp)} .bar.xp{height:4px} .bar.xp i{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:0}
.chip{font-size:10.5px;font-weight:800;padding:1px 5px;border-radius:3px;background:var(--panel-2);letter-spacing:.03em;text-transform:uppercase}
.chip.bad{color:var(--danger)} .chip.good{color:var(--ok)}
.float{position:absolute;left:50%;bottom:55%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:26px;
  color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000;pointer-events:none;animation:floatUp .8s ease-out forwards;white-space:nowrap;z-index:3}
.float.crit{color:var(--gold);font-size:34px} .float.heal{color:var(--ok)} .float.miss{color:var(--muted);font-size:18px}
.lunge-hero{animation:lungeH .26s} .lunge-enemy{animation:lungeE .26s} .hurt{animation:hurt .32s}
.dead{transition:opacity .5s,transform .5s;opacity:0;transform:translateY(14px) scale(.9)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
@keyframes lungeH{50%{transform:translate(26px,-18px)}}
@keyframes lungeE{50%{transform:translate(-26px,18px)}}
@keyframes hurt{0%,100%{transform:none;filter:none}25%{transform:translateX(-5px);filter:brightness(3)}75%{transform:translateX(5px)}}
@keyframes pulse{to{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.lunge-hero,.lunge-enemy,.hurt,.intent.danger{animation:none}.float{animation-duration:.5s}}

/* HUD héros */
.hud{display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:4px;align-items:center;font-size:12.5px}
.hud .who{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:15px}
.hud label{font-family:var(--display);color:var(--muted);width:92px}
.hud .xp{grid-column:1/-1}

.log{height:74px;flex:0 0 auto;overflow-y:auto;background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.log p.good{color:var(--ok)} .log p.bad{color:var(--danger)} .log p.info{color:var(--muted)}

.actions{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding-bottom:4px}
.actions .w3{grid-column:span 3} .actions .w2{grid-column:span 2}
.actions .w2 b{font-size:14px;padding-right:0;margin-top:13px}
.actions .w2 .cost{left:10px;right:auto;top:5px}

/* Écrans hors combat */
.sheet{display:flex;flex-direction:column;gap:14px;padding-block:6px}
.lede{max-width:60ch}
.cards{display:flex;flex-direction:column;gap:10px}
.card{flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
.card img.spr{width:60px;height:60px;flex:none}
.card .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.card .stats{font-family:var(--display);font-size:12.5px;color:var(--gold)}
.sec{font-family:var(--display);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn b{padding-right:46px}
.statline{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--display);font-size:14px;background:var(--panel);border-radius:8px;padding:8px 10px}
.statline span b{color:var(--gold);font-weight:600}
.price{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:12px;color:var(--gold)}
.hero-big{display:flex;align-items:flex-end;gap:14px}
.hero-big img.spr{width:84px;height:84px}
</style>

<div id="app"></div>

<script>
"use strict";
/* ───────────── Données ───────────── */
const CLASSES={
  guerrier:{name:"Guerrier",hp:64,mp:12,atk:9,def:3,crit:.08,guardPct:.7,skills:["frappe","cri","bouclier"],
    blurb:"Encaisse et cogne. Sa garde bloque 70 % des dégâts."},
  mage:{name:"Mage",hp:50,mp:26,atk:7,def:1,crit:.08,guardPct:.5,skills:["feu","givre","barriere"],
    blurb:"Fragile, mais ses sorts font fondre les boss. +2 PM par tour."},
  voleur:{name:"Voleur",hp:54,mp:16,atk:8,def:2,crit:.25,guardPct:.5,skills:["poison","sournois","fumee"],
    blurb:"Critiques fréquents, poison, esquive. +25 % d'or."}
};
const SKILLS={
  frappe:{n:"Frappe lourde",c:4,d:"190 % de dégâts",run(h,e,ev){hit(h,e,1.9,{msg:"Vous abattez votre lame."},ev)}},
  cri:{n:"Cri de guerre",c:3,d:"+50 % ATK, 3 tours",run(h,e,ev){h.st.atkUp=4;say(ev,"Vous poussez un cri de guerre : votre attaque grimpe.","good")}},
  bouclier:{n:"Coup de bouclier",c:5,d:"110 % + étourdit",run(h,e,ev){hit(h,e,1.1,{msg:"Vous chargez bouclier en avant."},ev);stun(e,ev,"est sonné")}},
  feu:{n:"Boule de feu",c:5,d:"210 % + brûlure",run(h,e,ev){if(hit(h,e,2.1,{msg:"Une boule de feu jaillit de votre bâton."},ev)&&e.hp>0)e.st.burn={t:3,d:Math.ceil(h.atk*.4)}}},
  givre:{n:"Éclat de givre",c:4,d:"130 % + gèle",run(h,e,ev){hit(h,e,1.3,{msg:"Un éclat de givre fuse."},ev);stun(e,ev,"est gelé")}},
  barriere:{n:"Barrière",c:4,d:"Absorbe les coups",run(h,e,ev){h.st.shield=12+h.lvl*4;say(ev,"Une barrière arcanique vous enveloppe ("+h.st.shield+").","good")}},
  poison:{n:"Lame empoisonnée",c:3,d:"100 % + poison",run(h,e,ev){if(hit(h,e,1,{msg:"Votre lame enduite de venin entaille."},ev)&&e.hp>0)e.st.poison={t:4,d:Math.ceil(h.atk*.35)}}},
  sournois:{n:"Coup sournois",c:4,d:"Critique garanti",run(h,e,ev){hit(h,e,1,{msg:"Vous frappez dans le dos.",crit:true},ev)}},
  fumee:{n:"Fumigène",c:5,d:"Esquive le prochain coup",run(h,e,ev){h.st.dodge=true;say(ev,"Vous lâchez un fumigène et disparaissez.","good")}}
};
const MOVES={
  atk:{label:"Attaque",kind:"atk",run(e,h,ev){hit(e,h,1,{msg:e.le+" attaque."},ev)}},
  double:{label:"Double coup",kind:"atk",run(e,h,ev){hit(e,h,.65,{msg:e.le+" frappe une fois."},ev);if(h.hp>0)hit(e,h,.65,{msg:"Puis une deuxième."},ev)}},
  charge:{label:"Prend son élan…",kind:"warn",run(e,h,ev){say(ev,e.le+" rassemble ses forces. Ça va faire mal !","bad")}},
  heavy:{label:"Coup terrible !",kind:"danger",run(e,h,ev){hit(e,h,2.3,{msg:e.le+" déchaîne un coup terrible."},ev)}},
  breath:{label:"Souffle de feu !",kind:"danger",run(e,h,ev){if(hit(e,h,1.7,{msg:e.le+" crache un torrent de flammes.",pierce:true},ev)&&h.hp>0)h.st.burn={t:3,d:Math.ceil(e.atk*.3)}}},
  guard:{label:"Se protège",kind:"def",run(e,h,ev){e.st.guard=true;say(ev,e.le+" se met en garde.","info")}},
  poison:{label:"Spores toxiques",kind:"debuff",run(e,h,ev){if(hit(e,h,.6,{msg:e.le+" crache des spores."},ev)&&h.hp>0)h.st.poison={t:3,d:Math.ceil(e.atk*.3)}}},
  drain:{label:"Drain de vie",kind:"atk",run(e,h,ev){const d=hit(e,h,.8,{msg:e.le+" aspire votre vie."},ev);if(d)heal(e,d,ev)}},
  heal:{label:"Se régénère",kind:"def",run(e,h,ev){say(ev,e.le+" se régénère.","info");heal(e,Math.round(e.hpMax*.12),ev)}},
  curse:{label:"Malédiction",kind:"debuff",run(e,h,ev){h.st.weak=3;say(ev,e.le+" vous maudit : votre attaque faiblit.","bad")}}
};
const FLOORS=[
  {id:"slime",un:"un Slime",le:"Le Slime",hp:36,atk:10,def:0,pat:["atk","atk","heal"]},
  {id:"bat",un:"une Chauve-souris",le:"La Chauve-souris",hp:33,atk:11,def:0,pat:["atk","drain"]},
  {id:"gob",un:"un Gobelin",le:"Le Gobelin",hp:50,atk:13,def:1,pat:["atk","atk","charge","heavy"]},
  {id:"roi",boss:1,un:"le Roi Slime",le:"Le Roi Slime",hp:120,atk:14,def:1,pat:["atk","charge","heavy","heal","atk"]},
  {id:"champi",un:"un Champignon vénéneux",le:"Le Champignon",hp:80,atk:18,def:2,pat:["poison","atk","atk"]},
  {id:"skel",un:"un Squelette",le:"Le Squelette",hp:88,atk:22,def:3,pat:["atk","guard","atk","charge","heavy"]},
  {id:"loup",un:"un Loup des ombres",le:"Le Loup",hp:96,atk:24,def:2,pat:["double","atk","double"]},
  {id:"liche",boss:1,un:"la Liche",le:"La Liche",hp:220,atk:26,def:3,pat:["curse","atk","drain","charge","heavy","atk"]},
  {id:"ghost",un:"un Spectre",le:"Le Spectre",hp:115,atk:30,def:2,evade:.25,pat:["atk","curse","drain"]},
  {id:"golem",un:"un Golem de pierre",le:"Le Golem",hp:150,atk:32,def:6,pat:["guard","atk","charge","heavy"]},
  {id:"knight",un:"un Chevalier maudit",le:"Le Chevalier maudit",hp:165,atk:36,def:5,pat:["atk","double","guard","charge","heavy"]},
  {id:"dragon",boss:1,un:"le Dragon ancien",le:"Le Dragon",hp:340,atk:35,def:5,pat:["atk","double","charge","breath","atk","charge","heavy"]}
];
const ZONES=["Forêt des Murmures","Crypte Oubliée","Pic du Dragon"];
const BOONS={
  vita:{n:"Vitalité",d:"+14 PV max",run(h){h.hpMax+=14;h.hp+=14}},
  esprit:{n:"Esprit",d:"+8 PM max",run(h){h.mpMax+=8;h.mp+=8}},
  force:{n:"Force",d:"+2 ATK",run(h){h.atk+=2}},
  carapace:{n:"Carapace",d:"+1 DÉF",run(h){h.def+=1}},
  lynx:{n:"Œil de lynx",d:"+8 % de critique",run(h){h.crit+=.08}},
  souffle:{n:"Second souffle",d:"PV et PM au maximum",run(h){h.hp=h.hpMax;h.mp=h.mpMax}},
  besace:{n:"Besace",d:"+1 potion, +1 éther",run(h){h.potions++;h.ethers++}}
};
const zoneOf=f=>Math.min(2,Math.floor((f-1)/4));
const need=l=>18+l*10;

/* ───────────── État et règles ───────────── */
let S={screen:"title"};
let META={best:0,wins:0,sound:true};

function say(ev,m,c){const l={m,c:c||""};S.log.push(l);if(S.log.length>40)S.log.shift();ev.push({t:"log",m,c:l.c})}
function whoOf(u){return u===S.hero?"hero":"enemy"}
function heal(u,n,ev){n=Math.min(n,u.hpMax-u.hp);if(n<=0)return;u.hp+=n;ev.push({t:"heal",who:whoOf(u),n,hp:u.hp})}
function stun(e,ev,txt){if(e.hp<=0)return;if(e.boss&&Math.random()<.5){say(ev,e.le+" résiste.","info");return}e.st.stun=1;say(ev,e.le+" "+txt+" et perdra son tour.","good")}
function hit(src,tgt,mult,o,ev){
  const tw=whoOf(tgt);
  ev.push({t:"lunge",who:whoOf(src)});
  if(tgt.st.dodge){tgt.st.dodge=false;say(ev,o.msg+" Esquivé dans la fumée !","good");ev.push({t:"miss",who:tw});return 0}
  if(tgt.evade&&o.basic&&Math.random()<tgt.evade){say(ev,o.msg+" "+tgt.le+" se dérobe : raté.","info");ev.push({t:"miss",who:tw});return 0}
  const atk=src.atk*(src.st.atkUp?1.5:1)*(src.st.weak?.7:1);
  const crit=!!o.crit||Math.random()<src.crit;
  let d=atk*mult*(.9+Math.random()*.2)*(crit?1.75:1)-(o.pierce?0:tgt.def);
  d=Math.max(1,Math.round(d));
  if(tgt.st.guard)d=Math.max(1,Math.round(d*(1-(tgt.guardPct||.5))));
  let abs=0;
  if(tgt.st.shield){abs=Math.min(tgt.st.shield,d);tgt.st.shield-=abs;d-=abs;if(!tgt.st.shield)delete tgt.st.shield}
  tgt.hp=Math.max(0,tgt.hp-d);
  say(ev,o.msg+(crit?" Critique !":"")+" "+d+" dégâts"+(abs?" ("+abs+" absorbés)":"")+".",tw==="hero"?"bad":"");
  ev.push({t:"dmg",who:tw,n:d,crit,hp:tgt.hp});
  return d||abs;
}
function tick(u,ev){
  const me=u===S.hero;
  for(const k of ["poison","burn"]){
    const s=u.st[k];if(!s||u.hp<=0)continue;
    u.hp=Math.max(0,u.hp-s.d);
    say(ev,(k==="poison"?"Le poison ":"Les flammes ")+(me?"vous ":"")+(k==="poison"?"ronge":"rongent")+(me?"":" "+u.le.toLowerCase())+" : "+s.d+" dégâts.",me?"bad":"");
    ev.push({t:"dmg",who:whoOf(u),n:s.d,hp:u.hp,dot:1});
    if(--s.t<=0)delete u.st[k];
  }
  for(const k of ["atkUp","weak"])if(u.st[k]&&--u.st[k]<=0)delete u.st[k];
}
function newRun(cls){
  const c=CLASSES[cls];
  S={screen:"battle",floor:1,log:[],prices:{atk:45,def:35,hp:30},campDone:false,choices:null,pending:0,
    hero:{cls,name:c.name,lvl:1,xp:0,gold:0,hp:c.hp,hpMax:c.hp,mp:c.mp,mpMax:c.mp,atk:c.atk,def:c.def,crit:c.crit,guardPct:c.guardPct,potions:2,ethers:1,st:{}}};
  spawn();
}
function spawn(){
  const f=FLOORS[S.floor-1];
  S.enemy=Object.assign({},f,{hpMax:f.hp,st:{},pi:0,crit:.05});
  S.hero.st={};S.log=[];
  say([], "Étage "+S.floor+" — "+f.un+" vous barre la route.","info");
}
function intent(){const e=S.enemy;return MOVES[e.pat[e.pi%e.pat.length]]}
function canAct(a){
  const h=S.hero;
  if(a==="potion")return h.potions>0&&h.hp<h.hpMax;
  if(a==="ether")return h.ethers>0&&h.mp<h.mpMax;
  if(SKILLS[a])return h.mp>=SKILLS[a].c;
  return a==="attack"||a==="defend";
}
function act(a){
  if(S.screen!=="battle"||!canAct(a))return null;
  const h=S.hero,e=S.enemy,ev=[];
  h.st.guard=false;
  if(a==="attack")hit(h,e,1,{msg:"Vous frappez.",basic:true},ev);
  else if(a==="defend"){h.st.guard=true;h.mp=Math.min(h.mpMax,h.mp+2);say(ev,"Vous vous mettez en garde.","info")}
  else if(a==="potion"){h.potions--;say(ev,"Vous buvez une potion.","good");heal(h,Math.round(h.hpMax*.4),ev)}
  else if(a==="ether"){h.ethers--;const n=Math.min(h.mpMax-h.mp,Math.round(h.mpMax*.6));h.mp+=n;say(ev,"Vous buvez un éther : +"+n+" PM.","good")}
  else{const s=SKILLS[a];h.mp-=s.c;s.run(h,e,ev)}
  if(e.hp<=0)return win(ev);
  // tour de l'ennemi
  e.st.guard=false;
  if(e.st.stun){delete e.st.stun;e.pi++;say(ev,e.le+" perd son tour.","info")}
  else{const m=intent();e.pi++;m.run(e,h,ev)}
  if(h.hp<=0)return lose(ev);
  tick(h,ev);tick(e,ev);
  if(h.hp<=0)return lose(ev);
  if(e.hp<=0)return win(ev);
  h.st.guard=false;
  h.mp=Math.min(h.mpMax,h.mp+(h.cls==="mage"?2:1));
  return ev;
}
function win(ev){
  const h=S.hero,e=S.enemy;
  const gold=Math.round((8+S.floor*3)*(e.boss?3:1)*(h.cls==="voleur"?1.25:1)*(.85+Math.random()*.3));
