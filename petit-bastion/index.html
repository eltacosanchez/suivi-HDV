<style>
/* Layout : plateau carré au centre, ressources au-dessus, commandes au pouce en dessous. */
:root{
  color-scheme:light;
  --bg:#24402f; --bg2:#1b3225;
  --paper:#f7efd9; --paper2:#eadfc2; --line:#cdbd94;
  --ink:#2b2620; --muted:#75695a;
  --wood:#a9713f; --crystal:#2e9fb5; --red:#c8414f; --gold:#e3a02c; --ok:#3f8f4a;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font-family:var(--body);font-size:14px;line-height:1.35;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-block:8px;position:relative;overflow-y:auto}
h1,h2,h3,.dsp{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

.hud{display:flex;gap:6px;align-items:stretch}
.pill{flex:1 1 0;min-width:0;background:var(--bg2);border-radius:8px;padding:5px 8px;display:flex;flex-direction:column;gap:0}
.pill small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;display:flex;align-items:center;gap:5px}
.pill b{font-family:var(--display);font-size:15px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:2px;background:var(--wood);display:inline-block;flex:none}
.dot.c{background:#5cc8d7;transform:rotate(45deg)} .dot.g{background:var(--gold);border-radius:50%} .dot.w{background:var(--paper)}
.goal{background:var(--paper);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px}
.goal b{font-family:var(--display)}
.board{position:relative;width:100%;aspect-ratio:1;max-width:100%;flex:none;border-radius:10px;overflow:hidden;background:#7cae62}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#2b2620e6;color:var(--paper);padding:5px 12px;border-radius:20px;font-weight:600;font-size:13px;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

.panel{background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;flex:none}
.panel h3{font-size:17px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h3 small{font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted)}
.info{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px}
.row>*{flex:1 1 0;min-width:0}
.btn{background:var(--paper2);border:2px solid var(--line);border-bottom-width:4px;border-radius:9px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.btn b{font-family:var(--display);font-size:15px;line-height:1.15}
.btn small{font-size:11.5px;color:var(--muted);line-height:1.25}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--red);border-color:#8f2a36;color:#fff} .btn.go small{color:#ffd9de}
.btn.ok{background:var(--ok);border-color:#2c6a35;color:#fff} .btn.ok small{color:#d9f2dc}
.btn.sel{border-color:var(--ink);background:#fff}
.btn.slim{flex:0 0 auto;align-items:center;justify-content:center}
.alert{background:var(--red);color:#fff;border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.alert button{background:#fff;color:var(--red);border:0;border-radius:6px;padding:6px 12px;font-family:var(--display);font-weight:800}

.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:14px 14px 10px 10px;
  padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -8px 30px #0008;z-index:5}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet header h2{font-size:20px}
.x{background:none;border:0;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);padding:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.item .nm{font-family:var(--display);font-weight:800;font-size:15px}
.item .ds{font-size:12px;color:var(--muted);grid-column:1}
.item .act{grid-row:1/span 2;grid-column:2;display:flex;gap:6px}
.mini{background:var(--paper2);border:2px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:7px 11px;font-family:var(--display);font-weight:800;color:var(--ink);white-space:nowrap}
.mini:disabled{opacity:.45}
.stars{font-size:38px;letter-spacing:6px;color:var(--gold);font-family:var(--display);line-height:1}
.stars i{font-style:normal;color:var(--line)}
.bt-top{display:flex;gap:6px}
.title{display:flex;flex-direction:column;gap:12px;justify-content:center;flex:1}
.title h1{font-size:44px;line-height:.95;color:var(--paper)}
.title p{max-width:34ch;opacity:.9;font-size:15px}
</style>

<div id="app"></div>

<script>
"use strict";
/* ───────────── Règles (sans affichage) ───────────── */
const N=16;
const B={
  donjon:{n:"Donjon",s:3,hp:[700,1000,1400,1900],cost:[[0,0],[400,200],[1500,1000],[4000,3000]],time:[0,60,240,600],d:"Cœur du village. Son niveau débloque bâtiments et améliorations."},
  scierie:{n:"Scierie",s:2,hp:[200,260,330,420],cost:[[50,0],[150,0],[400,100],[900,300]],time:[8,40,120,300],rate:[30,50,80,120],res:"bois",d:"Produit du bois en continu."},
  mine:{n:"Mine de cristal",s:2,hp:[200,260,330,420],cost:[[60,0],[160,0],[420,100],[950,300]],time:[8,40,120,300],rate:[20,35,55,85],res:"cristal",d:"Extrait du cristal en continu."},
  entrepot:{n:"Entrepôt",s:2,hp:[300,380,470,580],cost:[[100,0],[300,100],[800,300],[1800,800]],time:[10,45,150,360],cap:[1000,2500,5000,9000],d:"Augmente le stock maximum de bois et de cristal."},
  caserne:{n:"Caserne",s:2,hp:[260,330,410,500],cost:[[100,0],[350,150],[900,500],[2000,1200]],time:[10,60,180,420],room:[10,16,22,30],d:"Loge l'armée. Chaque niveau débloque une troupe et renforce les autres."},
  tour:{n:"Tour de guet",s:2,def:1,hp:[320,400,490,600],cost:[[120,0],[100,200],[250,500],[600,1100]],time:[12,50,150,360],dps:[10,13,17,22],range:4.5,d:"Tire sur un pillard à la fois."},
  catapulte:{n:"Catapulte",s:2,def:1,hp:[350,430,520,630],cost:[[350,150],[200,400],[450,800],[900,1600]],time:[20,60,180,400],dmg:[20,27,35,45],range:6.5,minRange:2,cd:3.2,splash:1.3,d:"Lente, mais ses pierres touchent tout un groupe."},
  mur:{n:"Palissade",s:1,hp:[0],cost:[[15,0]],time:[0],d:"Ralentit les pillards. Se renforce avec le Donjon."}
};
const CAPS={donjon:[1,1,1,1],scierie:[1,2,3,3],mine:[1,2,3,3],entrepot:[1,1,2,2],caserne:[1,1,1,1],tour:[1,2,3,4],catapulte:[0,1,1,2],mur:[10,20,30,40]};
const T={
  piquier:{n:"Piquier",space:1,cost:20,hp:48,dps:10,speed:1.7,range:.9,unlock:1,d:"Fantassin bon marché."},
  frondeuse:{n:"Frondeuse",space:1,cost:30,hp:24,dps:9,speed:1.6,range:3.2,unlock:2,d:"Tire par-dessus les palissades. Fragile."},
  brute:{n:"Brute",space:4,cost:130,hp:340,dps:16,speed:1.05,range:.9,unlock:3,pref:1,d:"Encaisse et fonce sur les défenses."}
};
const sz=b=>B[b.type].s;
let S=null;
function rng32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newGame(){S={v:1,seed:(Math.random()*1e9)|0,res:{bois:300,cristal:150},gloire:0,nid:2,bs:[{id:1,type:"donjon",lvl:1,x:6,y:6}],
  army:{piquier:0,frondeuse:0,brute:0},raidLv:1,raids:0,wave:0,incoming:false,target:null}}
const dl=()=>S.bs.find(b=>b.type==="donjon").lvl;
const count=t=>S.bs.filter(b=>b.type===t).length;
const resCap=()=>500+S.bs.reduce((a,b)=>a+(b.type==="entrepot"&&b.lvl?B.entrepot.cap[b.lvl-1]:0),0);
const armyRoom=()=>S.bs.reduce((a,b)=>a+(b.type==="caserne"&&b.lvl?B.caserne.room[b.lvl-1]:0),0);
const armyUsed=()=>Object.keys(T).reduce((a,k)=>a+S.army[k]*T[k].space,0);
const casLvl=()=>Math.max(0,...S.bs.filter(b=>b.type==="caserne").map(b=>b.lvl));
const busy=()=>S.bs.filter(b=>b.upTo).length;
const afford=c=>S.res.bois>=c[0]&&S.res.cristal>=c[1];
const lack=c=>S.res.bois<c[0]?"Pas assez de bois":"Pas assez de cristal";
function occupied(bs,x,y,s,ignore){return bs.some(b=>b!==ignore&&b.alive!==false&&x<b.x+sz(b)&&b.x<x+s&&y<b.y+sz(b)&&b.y<y+s)}
function freeSpot(s){let best=null,bd=1e9;for(let y=2;y<=14-s;y++)for(let x=2;x<=14-s;x++){if(occupied(S.bs,x,y,s))continue;const d=Math.hypot(x+s/2-8,y+s/2-8);if(d<bd){bd=d;best={x,y}}}return best}
function whyNot(type){
  const d=B[type],c=CAPS[type];
  if(count(type)>=c[dl()-1])return c[3]>count(type)?"Donjon niv. "+(c.findIndex(v=>v>count(type))+1)+" requis":"Maximum atteint";
  if(!afford(d.cost[0]))return lack(d.cost[0]);
  if(d.time[0]&&busy()>=2)return "Les 2 ouvriers sont occupés";
  if(!freeSpot(d.s))return "Plus de place";
  return "";
}
function build(type,t){
  if(whyNot(type))return null;
  const d=B[type],p=freeSpot(d.s);S.res.bois-=d.cost[0][0];S.res.cristal-=d.cost[0][1];
  const b={id:S.nid++,type,lvl:0,x:p.x,y:p.y};
  if(d.time[0])b.upTo=t+d.time[0]*1000;else b.lvl=1;
  if(d.rate){b.t0=t;b.bank=0}
  S.bs.push(b);return b;
}
function whyNoUp(b){
  const d=B[b.type];
  if(b.upTo)return "En chantier";
  if(b.type==="mur")return "Se renforce avec le Donjon";
  if(b.lvl>=4)return "Niveau maximum";
  if(b.type!=="donjon"&&b.lvl>=dl())return "Améliorez d'abord le Donjon";
  if(!afford(d.cost[b.lvl]))return lack(d.cost[b.lvl]);
  if(busy()>=2)return "Les 2 ouvriers sont occupés";
  return "";
}
function upgrade(b,t){if(whyNoUp(b))return false;const c=B[b.type].cost[b.lvl];S.res.bois-=c[0];S.res.cristal-=c[1];b.upTo=t+B[b.type].time[b.lvl]*1000;return true}
function avail(b,t){const d=B[b.type];if(!d.rate)return 0;const r=b.lvl?d.rate[b.lvl-1]:0,bank=b.bank||0;return Math.min(Math.max(r*30,bank),bank+r*Math.max(0,t-b.t0)/60000)}
function collect(b,t){const d=B[b.type];if(!d.rate)return 0;const a=avail(b,t),n=Math.min(Math.floor(a),resCap()-S.res[d.res]);if(n<=0)return 0;S.res[d.res]+=n;b.bank=a-n;b.t0=t;return n}
function tick(t){let ch=false;for(const b of S.bs)if(b.upTo&&b.upTo<=t){if(B[b.type].rate){b.bank=avail(b,t);b.t0=t}b.lvl++;delete b.upTo;ch=true}return ch}
function train(type,n){const d=T[type];let k=0;if(casLvl()<d.unlock)return 0;while(k<n&&S.res.cristal>=d.cost&&armyUsed()+d.space<=armyRoom()){S.res.cristal-=d.cost;S.army[type]++;k++}return k}

/* Villages adverses, générés à partir du niveau de raid */
function genBase(lv,seed){
  const r=rng32(seed+lv*7919),d=Math.min(4,1+Math.floor((lv-1)/3)),L=[];
  const lvl=()=>Math.max(1,d-(r()<.45?1:0));
  const put=(type,rad)=>{const s=B[type].s;for(let R=rad;R<12;R+=.7){const c=[];for(let y=2;y<=14-s;y++)for(let x=2;x<=14-s;x++)if(!occupied(L,x,y,s)&&Math.hypot(x+s/2-8,y+s/2-8)<=R)c.push([x,y]);
    if(c.length){const p=c[Math.floor(r()*c.length)];L.push({type,lvl:type==="mur"?1:lvl(),x:p[0],y:p[1]});return}}};
  L.push({type:"donjon",lvl:d,x:6+(r()<.5?0:1),y:6+(r()<.5?0:1)});
  const nT=Math.min(CAPS.tour[d-1],1+Math.floor(lv/2.5)),nC=lv>=4?Math.min(CAPS.catapulte[d-1],lv>=10?2:1):0;
  for(let i=0;i<nT;i++)put("tour",3.4);
  for(let i=0;i<nC;i++)put("catapulte",3.2);
  let x0=99,y0=99,x1=0,y1=0;for(const b of L){x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+sz(b));y1=Math.max(y1,b.y+sz(b))}
  x0=Math.max(2,x0-1);y0=Math.max(2,y0-1);x1=Math.min(13,x1);y1=Math.min(13,y1);
  const per=[];for(let x=x0;x<=x1;x++)per.push([x,y0]);for(let y=y0+1;y<=y1;y++)per.push([x1,y]);for(let x=x1-1;x>=x0;x--)per.push([x,y1]);for(let y=y1-1;y>y0;y--)per.push([x0,y]);
  const nW=Math.min(CAPS.mur[d-1],4+lv*3),st=Math.floor(r()*per.length);let pw=0;
  for(let i=0;i<per.length&&pw<nW;i++){const p=per[(st+i)%per.length];if(!occupied(L,p[0],p[1],1)){L.push({type:"mur",lvl:1,x:p[0],y:p[1]});pw++}}
  const nS=Math.min(CAPS.scierie[d-1],1+Math.floor(lv/3));
  for(let i=0;i<nS;i++){put("scierie",5.5);put("mine",5.5)}
  if(lv>=2){put("entrepot",5);if(lv>=8)put("entrepot",5)}
  put("caserne",5.5);
  return {lv,layout:L,loot:{bois:120+90*lv,cristal:80+70*lv}};
}
function target(){if(!S.target||S.target.lv!==S.raidLv)S.target=genBase(S.raidLv,S.seed);return S.target}
function raiders(w,seed){
  const r=rng32(seed+w*104729),q=[],side=Math.floor(r()*4);
  const list=[];for(let i=0;i<(w>=5?Math.floor((w-3)/2):0);i++)list.push("brute");for(let i=0;i<3+w;i++)list.push("piquier");for(let i=0;i<(w>=3?w-2:0);i++)list.push("frondeuse");
  list.forEach((type,i)=>{const a=2.5+r()*11,o=.4+r()*1.1,p=side===0?[a,o]:side===1?[N-o,a]:side===2?[a,N-o]:[o,a];q.push({t:.5+i*.35,type,x:p[0],y:p[1]})});
  return q;
}

/* Bataille en temps réel */
function makeBattle(layout,mode,o){
  const bt={mode,bs:[],grid:new Int16Array(N*N),troops:[],shots:[],t:0,started:mode==="defense",over:false,ver:1,fc:{},destroyed:0,total:0,limit:120,
    m:o.m||1,queue:(o.queue||[]).slice(),left:o.army?Object.assign({},o.army):null,loot:o.loot||null,keep:false};
  const dlv=(layout.find(b=>b.type==="donjon")||{lvl:1}).lvl;
  for(const l of layout){const d=B[l.type],max=l.type==="mur"?180+90*dlv:d.hp[l.lvl-1];
    const b={type:l.type,lvl:l.lvl,x:l.x,y:l.y,s:d.s,hp:max,max,alive:true,cd:Math.random()*.6};
    const i=bt.bs.push(b);for(let y=0;y<d.s;y++)for(let x=0;x<d.s;x++)bt.grid[(l.y+y)*N+l.x+x]=i;
    if(l.type!=="mur")bt.total++}
  return bt;
}
const inRing=(x,y)=>x>=0&&y>=0&&x<N&&y<N&&!(x>=2&&x<14&&y>=2&&y<14);
function spawn(bt,type,x,y){const d=T[type];bt.started=true;
  bt.troops.push({type,x,y,hp:d.hp*bt.m,max:d.hp*bt.m,tg:-1,tx:Math.floor(x),ty:Math.floor(y),dest:null,ox:(Math.random()-.5)*.5,oy:(Math.random()-.5)*.5,alive:true,sh:Math.random()})}
function deploy(bt,type,x,y){if(bt.over||!bt.left||!bt.left[type]||!inRing(Math.floor(x),Math.floor(y)))return false;bt.left[type]--;spawn(bt,type,x,y);return true}
function distRect(px,py,b){const dx=Math.max(b.x-px,0,px-(b.x+b.s)),dy=Math.max(b.y-py,0,py-(b.y+b.s));return Math.hypot(dx,dy)}
function costAt(bt,k){const g=bt.grid[k];if(!g)return 1;return bt.bs[g-1].type==="mur"?9:-1}
function field(bt,ti){
  const c=bt.fc[ti];if(c&&c.v===bt.ver)return c.f;
  const f=new Float32Array(N*N).fill(1e9),b=bt.bs[ti],q=[];
  for(let j=-1;j<=b.s;j++)for(let i=-1;i<=b.s;i++){const ex=i===-1||i===b.s,ey=j===-1||j===b.s;if(ex===ey)continue;const x=b.x+i,y=b.y+j;if(x<0||y<0||x>=N||y>=N)continue;const k=y*N+x,cc=costAt(bt,k);if(cc<0)continue;f[k]=cc-1;q.push(k)}
  for(let h=0;h<q.length;h++){const k=q[h],x=k%N,y=(k-x)/N;
    for(const nk of [x>0?k-1:-1,x<N-1?k+1:-1,y>0?k-N:-1,y<N-1?k+N:-1]){if(nk<0)continue;const cc=costAt(bt,nk);if(cc<0)continue;if(f[k]+cc<f[nk]){f[nk]=f[k]+cc;q.push(nk)}}}
  bt.fc[ti]={v:bt.ver,f};return f;
}
function hurtB(bt,b,n){if(!b.alive)return;b.hp-=n;if(b.hp<=0){b.alive=false;b.hp=0;bt.ver++;for(let y=0;y<b.s;y++)for(let x=0;x<b.s;x++)bt.grid[(b.y+y)*N+b.x+x]=0;if(b.type!=="mur")bt.destroyed++}}
function pickTarget(bt,u){
  let best=-1,bd=1e9,pref=T[u.type].pref&&bt.bs.some(b=>b.alive&&B[b.type].def);
  bt.bs.forEach((b,i)=>{if(!b.alive||b.type==="mur"||(pref&&!B[b.type].def))return;const d=distRect(u.x,u.y,b);if(d<bd){bd=d;best=i}});
  return best;
}
function stepTroop(bt,u,dt){
  const d=T[u.type];
  if(u.tg<0||!bt.bs[u.tg].alive){u.tg=pickTarget(bt,u);u.dest=null;u.tx=Math.max(0,Math.min(N-1,Math.floor(u.x)));u.ty=Math.max(0,Math.min(N-1,Math.floor(u.y)));if(u.tg<0)return}
  const b=bt.bs[u.tg];u.hit=null;
  if(distRect(u.x,u.y,b)<=d.range){u.hit=b;hurtB(bt,b,d.dps*bt.m*dt);return}
  if(!u.dest){
    const f=field(bt,u.tg),k=u.ty*N+u.tx;let bk=k,bv=f[k];

    return '<header><h2>Construire</h2><button class="x" data-u="closeSheet">Fermer</button></header>'+Object.keys(B).filter(k=>k!=="donjon").map(k=>{const d=B[k],why=whyNot(k);
      return '<div class="item"><span class="nm">'+d.n+' <small class="num" style="font-family:var(--body);color:var(--muted)">'+count(k)+'/'+CAPS[k][dl()-1]+'</small></span><span class="ds">'+d.d+(why?' <b style="color:var(--red)">'+why+'.</b>':'')+'</span>'+
      '<span class="act"><button class="mini" data-build="'+k+'"'+(why?" disabled":"")+'>'+costTxt(d.cost[0])+'</button></span></div>'}).join("");
  }
  if(sheet==="army"){
    const cl=casLvl();
    return '<header><h2>Armée <small class="num" style="font-size:14px;color:var(--muted)">'+armyUsed()+'/'+armyRoom()+' places</small></h2><button class="x" data-u="closeSheet">Fermer</button></header>'+
      (cl?'':'<p class="info">Construisez d\'abord une caserne.</p>')+Object.keys(T).map(k=>{const d=T[k],lock=cl<d.unlock,full=armyUsed()+d.space>armyRoom()||S.res.cristal<d.cost;
      return '<div class="item"><span class="nm">'+d.n+' ×'+S.army[k]+'</span><span class="ds">'+d.d+' '+d.space+' place'+(d.space>1?"s":"")+', '+d.cost+' cristal.'+(lock?' <b style="color:var(--red)">Caserne niv. '+d.unlock+' requise.</b>':'')+'</span>'+
      '<span class="act"><button class="mini" data-train="'+k+'" data-n="1"'+(lock||full?" disabled":"")+'>+1</button><button class="mini" data-train="'+k+'" data-n="5"'+(lock||full?" disabled":"")+'>+5</button></span></div>'}).join("")+
      '<p class="info">Les troupes envoyées au combat ne reviennent pas.</p>';
  }
  if(sheet==="result"){
    const o=result,raid=bt.mode==="raid",st="★".repeat(o.stars)+"<i>"+"★".repeat(3-o.stars)+"</i>";
    return '<header><h2>'+(raid?(o.stars?"Raid réussi":"Raid repoussé"):(o.stars===0?"Village défendu !":o.stars<2?"Pillards repoussés":"Village pillé"))+'</h2></header><div class="stars">'+st+'</div>'+
      '<p>'+Math.round(o.pct*100)+' % de destruction. '+(raid?"Butin : +"+fmt(o.bois)+" bois, +"+fmt(o.cristal)+" cristal.":(o.bois||o.cristal?"Volé : "+fmt(-o.bois)+" bois, "+fmt(-o.cristal)+" cristal.":"Rien n'a été volé.")+(o.bonus>0?" Prime : +"+o.bonus+" cristal.":""))+
      ' Gloire '+(o.gloire>=0?"+":"")+o.gloire+'.</p>'+(raid&&!o.stars?'<p class="info">Il faut au moins une étoile (50 % de destruction ou le Donjon) pour passer au raid suivant.</p>':'')+
      '<button class="btn ok" data-u="home"><b>Retour au village</b></button>';
  }
  return "";
}
function refresh(){
  const now=Date.now();
  if(screen==="village"){
    document.getElementById("hud").innerHTML=hud();document.getElementById("goal").innerHTML="<b>Objectif.</b> "+goal();
    document.getElementById("panel").innerHTML=panelHtml(now);
  }else if(screen==="battle"){
    const raid=bt.mode==="raid";
    document.getElementById("panel").innerHTML=raid?
      '<div class="row">'+Object.keys(T).map(k=>'<button class="btn'+(pick===k?" sel":"")+'" data-pick="'+k+'"'+(bt.left[k]?"":" disabled")+'><b>'+T[k].n+'</b><small>×'+bt.left[k]+'</small></button>').join("")+'</div>'+
      '<div class="row"><p class="info" style="flex:2">Touchez la bordure sombre pour déployer. Maintenez pour envoyer en rafale.</p><button class="btn slim" data-u="quit"><b>'+(bt.started?"Terminer":"Retour")+'</b></button></div>':
      '<h3>Défense du village</h3><p class="info">Vos tours et catapultes tirent seules. Placez-les au centre, derrière les palissades.</p>';
  }
  const sh=document.getElementById("sheet");if(sh){sh.hidden=!sheet;sh.innerHTML=sheet?sheetHtml():""}
}
function mount(){
  if(screen==="title"){
    app.innerHTML='<div class="title"><h1>Petit<br>Bastion</h1><p>Bâtissez votre village, levez une armée et partez piller les bastions voisins. Vos ressources continuent de s\'accumuler quand vous fermez le jeu.</p>'+
      '<button class="btn ok" data-u="play"><b>'+(store.get("bastion.save")?"Reprendre mon village":"Fonder mon village")+'</b></button>'+
      (store.get("bastion.save")?'<button class="btn" data-u="reset"><b>Recommencer de zéro</b><small>Efface le village actuel</small></button>':'')+'</div>';
    cv=null;return;
  }
  app.innerHTML=(screen==="village"?'<div id="hud"></div><div class="goal" id="goal"></div>':'<div class="bt-top hud"><div class="pill"><small>Temps</small><b class="num" id="b-t"></b></div><div class="pill"><small>Destruction</small><b class="num" id="b-p"></b></div><div class="pill"><small>Étoiles</small><b id="b-s" style="color:var(--gold)"></b></div></div>')+
    '<div class="board"><canvas id="cv"></canvas><div class="toast" id="toast" hidden></div></div><section class="panel" id="panel"></section><div class="sheet" id="sheet" hidden></div>';
  cv=document.getElementById("cv");cx=cv.getContext("2d");fit();bindCanvas();refresh();
}
function fit(){if(!cv)return;const r=cv.getBoundingClientRect(),dpr=Math.min(3,window.devicePixelRatio||1);cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.width*dpr);K=cv.width/N}
window.addEventListener("resize",fit);
function tileOf(e){const r=cv.getBoundingClientRect();return {fx:(e.clientX-r.left)/r.width*N,fy:(e.clientY-r.top)/r.height*N}}
function bindCanvas(){
  cv.addEventListener("pointerdown",e=>{
    const p=tileOf(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(screen==="battle"){if(bt.mode==="raid"&&!bt.over){hold=p;holdT=0;drop()}return}
    if(sheet)return;
    const b=S.bs.find(b=>p.fx>=b.x&&p.fx<b.x+sz(b)&&p.fy>=b.y&&p.fy<b.y+sz(b));
    if(b){sel=b.id;drag={b,ox:p.fx-b.x,oy:p.fy-b.y,sx:p.fx,sy:p.fy,moved:false,x:b.x,y:b.y,ok:true}}else sel=null;
    refresh();
  });
  cv.addEventListener("pointermove",e=>{
    const p=tileOf(e);if(screen==="battle"){if(hold)hold=p;return}
    if(!drag)return;
    if(!drag.moved&&Math.hypot(p.fx-drag.sx,p.fy-drag.sy)<.45)return;
    const s=sz(drag.b);drag.moved=true;drag.x=Math.max(2,Math.min(14-s,Math.round(p.fx-drag.ox)));drag.y=Math.max(2,Math.min(14-s,Math.round(p.fy-drag.oy)));
    drag.ok=!occupied(S.bs,drag.x,drag.y,s,drag.b);
  });
  const up=()=>{
    hold=null;if(!drag)return;const b=drag.b;
    if(drag.moved){if(drag.ok){b.x=drag.x;b.y=drag.y;save()}else toast("Emplacement occupé")}
    else if(B[b.type].rate&&b.lvl)doCollect(b,true);
    drag=null;
  };
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
}
function doCollect(b,quiet){const n=collect(b,Date.now()),d=B[b.type];if(n>0){fx.push({x:b.x+1,y:b.y,txt:"+"+fmt(n)+" "+d.res,t:0});save();refresh()}else if(!quiet||avail(b,Date.now())>=1)toast(avail(b,Date.now())>=1?"Stock plein : construisez ou améliorez un entrepôt":"Rien à récolter pour l'instant")}
function drop(){
  if(!hold||!bt||bt.over)return;
  if(!bt.left[pick]){const k=Object.keys(T).find(k=>bt.left[k]);if(!k)return;pick=k}
  if(deploy(bt,pick,hold.fx,hold.fy)){refresh()}else if(!inRing(Math.floor(hold.fx),Math.floor(hold.fy)))toast("Déployez sur la bordure sombre")
}
function endBattle(){
  result=bt.mode==="raid"?applyRaid(bt):applyDefense(bt);save();sheet="result";refresh();
}
app.addEventListener("click",e=>{
  const el=e.target.closest("button");if(!el||el.disabled)return;const d=el.dataset,now=Date.now();
  if(d.u==="play"){S=store.get("bastion.save");if(!S||!S.bs)newGame();screen="village";sel=null;sheet=null;mount();save();return}
  if(d.u==="reset"){newGame();save();screen="village";mount();return}
  if(d.build){const b=build(d.build,now);if(b){sel=b.id;if(d.build!=="mur")sheet=null;toast(B[d.build].n+" : glissez pour placer")}}
  else if(d.train){train(d.train,+d.n)}
  else if(d.pick){pick=d.pick}
  else if(d.u==="build"||d.u==="army"){sheet=d.u;sel=null}
  else if(d.u==="closeSheet"){sheet=null}
  else if(d.u==="close"){sel=null}
  else if(d.u==="up"){const b=S.bs.find(x=>x.id===sel);if(b)upgrade(b,now)}
  else if(d.u==="collect"){const b=S.bs.find(x=>x.id===sel);if(b)doCollect(b)}
  else if(d.u==="raid"){if(!armyUsed()){toast("Entraînez d'abord des troupes dans « Armée »");return}bt=startRaid();pick=Object.keys(T).find(k=>bt.left[k]);screen="battle";sheet=null;mount();toast("Raid "+S.raidLv+" : repérez les lieux, puis déployez");return}
  else if(d.u==="defend"){bt=startDefense();screen="battle";sheet=null;mount();toast("Vague "+(S.wave+1)+" : les pillards arrivent");return}
  else if(d.u==="quit"){if(bt.started){bt.over=true;endBattle()}else{screen="village";bt=null;mount()}return}
  else if(d.u==="home"){screen="village";bt=null;sheet=null;result=null;sel=null;mount();return}
  save();refresh();
});
let last=0,uiT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const now=Date.now(),dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  if(toastT&&now>toastT){const t=document.getElementById("toast");if(t)t.hidden=true;toastT=0}
  if(!S||!cv)return;
  if(screen==="village"){
    if(tick(now)){save();refresh()}
    drawVillage(now);
    if(now-uiT>500){uiT=now;const a=document.getElementById("cd"),b=S.bs.find(x=>x.id===sel);if(a&&b&&b.upTo)a.textContent=clock((b.upTo-now)/1000)}
  }else if(screen==="battle"&&bt){
    if(!bt.over){
      if(hold){holdT+=dt;if(holdT>.14){holdT=0;drop()}}
      for(let i=0;i<2;i++)step(bt,dt/2);
      if(bt.over)endBattle();
    }
    drawBattle();
    const o=outcome(bt);document.getElementById("b-t").textContent=clock(bt.limit-bt.t);document.getElementById("b-p").textContent=Math.round(o.pct*100)+" %";document.getElementById("b-s").textContent="★".repeat(o.stars)+"☆".repeat(3-o.stars);
  }
}
setInterval(()=>{if(S&&screen==="village")save()},10000);
function start(data){
  if(data&&data.S&&data.S.bs){S=data.S;screen="village"}
  mount();requestAnimationFrame(loop);
}
window.__bastion={drawB,drawGround};
try{if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.claude)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({S:screen==="title"?null:S}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
}
</script>
